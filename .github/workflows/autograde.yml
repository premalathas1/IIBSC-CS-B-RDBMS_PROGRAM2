          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Run Tests
        run: |
          chmod +x tests/verify.sh
          ./tests/verify.sh
  test-student-table:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout student repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f starter.sql
          test -f test_student.py
          echo "Required files found."

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Create database
        run: |
          rm -f database.db
          sqlite3 database.db < starter.sql

      - name: Check Student table
        run: |
          echo ".tables"
          sqlite3 database.db ".tables"

      - name: Display Student table structure
        run: |
          sqlite3 database.db "PRAGMA table_info(Student);"

      - name: Run automated tests
        run: |
          python3 test_student.py

      - name: Final verification
        run: |
          echo "================================="
          echo "Student Table Assignment PASSED"
          echo "================================="
