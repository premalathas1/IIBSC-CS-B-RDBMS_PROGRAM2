name: RDBMS Autograding

on:
  push:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Student Submission
        uses: actions/checkout@v4

      - name: Install MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server

      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          sudo systemctl status mysql --no-pager

      - name: Configure MySQL Root User
        run: |
          sudo mysql <<'SQL'
          ALTER USER 'root'@'localhost'
          IDENTIFIED WITH mysql_native_password BY 'root';
          FLUSH PRIVILEGES;
          SQL

      - name: Test MySQL Connection
        run: |
          mysql -u root -proot -e "SELECT VERSION();"

      - name: Run Autograder
        env:
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: |
          chmod +x test.sh
          ./test.sh
