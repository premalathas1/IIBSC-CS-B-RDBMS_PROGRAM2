- name: Install MySQL
  run: |
    sudo apt-get update
    sudo apt-get install -y mysql-server

- name: Start MySQL
  run: |
    sudo systemctl start mysql
    sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';"

- name: Run autograder
  env:
    MYSQL_PASSWORD: root
  run: |
    chmod +x test.sh
    ./test.sh
